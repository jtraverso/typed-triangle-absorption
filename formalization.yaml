    relationship: "builds-on"
    note: >-
      Same-author Paper I port. Shared sources originate in the aligned
      freezes. Its constructor-explicit module-visibility repair is reused;
      its Nash-Williams theorem and compiled project objects are not imported.

status:
  scope: >-
    Six compared statements: Theorems A–D, balanced consequence of B and
    Lemma SC. A concerns four labels and three-step links; D concerns all
    four-label families using every label with a forbidden partner for every
    label. B and its balanced form retain the typical-host property as a
    hypothesis. C retains its semidense and non-extremality assumptions.
    Lemma SC retains actual physical hinge supply and two explicit budgets.
    The Challenge uses source definitions rather than opaque definition holes.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "manual"
      notes: "Mathematical direction, scope decisions and responsibility by the author."
    - method: "agent"
      models: ["Aristotle (Harmonic)", "Claude (Anthropic)", "ChatGPT/Codex (OpenAI)"]
      framework: "Aristotle CLI and local coding assistants"
      tool_setup: >-
        AI systems contributed to exploring approaches, searching for
        counterexamples, developing proofs, formalization, review and
        manuscript preparation. Aristotle's role was not limited to
        translating completed proofs. Codex prepared this isolated module
        port, statement extraction and verification scripts.
      prompting_notes: "Author-directed research and packaging instructions in Spanish."
  notes: >-
    Python generated finite candidate certificates. Lean proves their
    coverage, uniqueness and use in universal statements; generated examples
    alone are not treated as proofs. The frozen development has historical
    clean-campaign evidence. This separate module-system port also completed
    its own build and post-build checks on 21 October 2026: ALL CHECKS PASSED.
    tools/final_build_evidence.json and tools/built_sources_manifest.json
    identify the verified sources and logs, independently of the freeze.

fidelity:
  divergences: >-
    Vertex types are finite, with universe 0 where required by the original
    theorem. Types are multisets of three labels. Edge-count vectors use
    ordered label pairs, an injective re-encoding of the unordered counts.
    The semidense interface uses ordered disagreement, twice unordered edit
    distance. Hinge supply has exponent i - 4 for fixed four roots.
    No decomposition result for arbitrary integrally divisible hosts is
    claimed. No equivalence with Keevash's general labelled-complex
    divisibility is claimed. The finite census is part of the proof of D,
    not an assumed membership certificate in its statement.

review:
  status: "agent-reviewed"
  reviewers: ["ChatGPT/Codex (OpenAI), acting for the author"]
  notes: >-
    Packaging review checked the frozen-source mapping, module headers,
    source line limits, independent Challenge imports and the six source
    statements. The independent Challenge/Solution build and strict local
    comparison passed for all 1,514 local modules; fifteen declarations use
    only standard Lean axioms. tools/BUILD_VERIFIED.md details the permitted
    repairs and evidence. No independent
    human review of this formalization is claimed. Palomar's own Comparator,
    NanoDa verification and editorial review have not yet been requested.

