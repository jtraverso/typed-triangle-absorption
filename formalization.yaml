version: "v0.4"

project:
  name: "Robust absorption for typed triangles"
  description: >-
    Typed triangle decomposition results from Paper II: a typical-host theorem
    under three-step links for four-label families; its nearly complete and
    balanced deductions with explicit type-weight hypotheses; a semidense
    two-label mixed-triangle theorem; a computer-assisted typical-host theorem
    for every admissible four-label family; and a terminal absorber obtained
    from a bounded signed certificate and explicit physical hinge supply.
    Divisibility includes global edge counts and local degree profiles.
    The typical-host hypotheses are retained; the result is not asserted for
    arbitrary divisible hosts. The repository contains the substantive proof
    development, including the finite family census and conserved-family
    constructions, with a small independent Mathlib-only Challenge.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

